<!doctype html>
<html><head><meta charset="utf-8"><title>BrickLink × LEGO PAB</title>
<style>
  body { width: 350px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang TC", sans-serif; color: #1d2433; background: #fff; }
  header { background: #1f3864; color: #fff; padding: 10px 12px; font-weight: 700; }
  section { padding: 10px 12px; border-bottom: 1px solid #eef0f3; }
  h3 { margin: 0 0 6px; font-size: 12px; color: #1f3864; }
  .site { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .st { color: #667085; font-size: 12px; text-align: right; }
  .err { color: #b42318; }
  button { background: #1f3864; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
  button.sec { background: #eef2f8; color: #1f3864; }
  textarea { width: 100%; box-sizing: border-box; height: 54px; font: 12px ui-monospace, Menlo, monospace; border: 1px solid #d0d5dd; border-radius: 6px; }
  label { display: block; margin: 3px 0; }
  small { color: #667085; }
  input[type=number] { width: 54px; }
</style></head>
<body>
<header data-i="pTitle"></header>
<section>
  <h3 data-i="pStatus"></h3>
  <div id="status"></div>
  <div style="margin-top:8px"><button id="sync" data-i="pSync"></button></div>
  <small data-i="pSyncNote"></small>
</section>
<section>
  <h3 data-i="pSettings"></h3>
  <label><input type="checkbox" id="US"> <span data-i="pUS"></span></label>
  <label><input type="checkbox" id="NL"> <span data-i="pNL"></span></label>
  <label><input type="checkbox" id="autoSync"> <span data-i="pAuto"></span> <input type="number" id="ttlHours" min="1" max="720"> <span data-i="pHours"></span></label>
  <label><span data-i="pLang"></span>：<select id="lang"><option value="auto" data-i="pLangAuto"></option><option value="zh">中文</option><option value="en">English</option></select></label>
</section>
<section>
  <h3 data-i="pAliases"></h3>
  <textarea id="aliases" placeholder="3006=92538&#10;4073=6141"></textarea>
  <small data-i="pAliasNote"></small>
  <h3 style="margin-top:8px" data-i="pColours"></h3>
  <textarea id="colors" placeholder="402=231"></textarea>
  <small data-i="pColourNote"></small>
  <div style="margin-top:8px"><button id="save" class="sec" data-i="pSave"></button> <span id="saved" class="st"></span></div>
</section>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body></html>
